<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Calisthenics Coach</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f5f6fa;--fg:#12151f;--card:#fff;--ac:#16a34a;--mut:#6b7280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--fg:#eef1f7;--card:#1a1f2b;--mut:#9aa3b2}}
:root[data-theme="dark"]{--bg:#0e1117;--fg:#eef1f7;--card:#1a1f2b;--mut:#9aa3b2}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
h1{font-size:22px;margin:4px 0 0}h2{font-size:17px;margin:0}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:14px;padding:14px}
.big{font-size:28px;font-weight:700;margin:4px 0}
.start{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:14px;padding:15px;background:var(--card);color:var(--fg);font-size:17px;text-align:left}
.start span{color:var(--mut);font-size:13px}.start b{color:var(--ac)}
.btn{border:0;border-radius:12px;padding:16px;background:var(--ac);color:#fff;font-size:18px;width:100%}
.btn.g{background:#8883;color:var(--fg);font-size:15px;padding:12px}
.row{display:flex;gap:10px}.fld{flex:1}.fld label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #8885;background:var(--bg);color:var(--fg);font-size:20px;text-align:center}
select{font-size:16px;text-align:left}
.bar{height:6px;border-radius:3px;background:#8883;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.set{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #8883}
.ctr{text-align:center}.clock{font-size:72px;font-weight:700;font-variant-numeric:tabular-nums;margin:16px 0 4px}
.cur{background:#16a34a22;border-radius:8px;padding-left:6px}
.hint{background:#16a34a22;border-radius:10px;padding:8px 10px;font-size:14px}
#nav{display:flex;gap:2px;padding:6px;background:var(--card);border-top:1px solid #8883}
#nav button{flex:1;padding:6px 2px;border:0;border-radius:12px;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px}
#nav button.on{color:var(--ac);font-weight:700;background:#16a34a22}
#nav button i{font-style:normal;font-size:21px;line-height:1}
svg{width:100%;height:auto}
</style>
</head>
<body>
<main id="m"></main>
<div id="nav"></div>
<script>
const BASE = {
  'Push': [['Dips',3,'6–12',90],['Liegestütze auf Parallettes',3,'8–15',75],['Kurzhantel-Schulterdrücken',3,'8–12',75],['Langhantel-Bankdrücken',3,'6–10',90],['Trizepsdrücken (Kurzhantel)',2,'10–15',60]],
  'Pull': [['Klimmzüge',4,'5–10',90],['Langhantel-Rudern',3,'8–12',90],['Kurzhantel-Rudern',3,'8–12',75],['Bizeps-Curls (Kurzhantel)',3,'10–12',60]],
  'Legs': [['Langhantel-Kniebeugen',4,'6–10',120],['Rumänisches Kreuzheben',3,'8–10',90],['Ausfallschritte (Kurzhantel)',3,'10 je Bein',75],['Wadenheben',3,'15',45]],
  'Core': [['Hängendes Beinheben',3,'8–15',60],['L-Sit auf Parallettes (Sek.)',3,'max',60],['Plank (Sek.)',3,'max',45],['Russian Twist (Kurzhantel)',3,'20',45]],
  'Ganzkörper': [['Langhantel-Kniebeugen',3,'6–10',90],['Klimmzüge',3,'5–10',90],['Dips',3,'6–12',90],['Kurzhantel-Schulterdrücken',2,'8–12',75],['Langhantel-Rudern',2,'8–12',75],['Hängendes Beinheben',2,'8–15',60]]
};
let PLAN = BASE;
const SK = [
 ['hs','Handstand','🤸','Schultern aktiv hochdrücken, Rippen einziehen, mit den Fingern die Balance steuern.',[['Wand-Handstand (Brust zur Wand)','3×30 s'],['Wand-Handstand (Bauch zur Wand)','3×30 s'],['Kick-ups, frei balancieren','5×10 s'],['Freier Handstand','3×30 s']]],
 ['mu','Muscle-Up','🔝','Zieh explosiv bis zur Hüfte, dann schnell über die Stange kippen. Gerade Klimmzüge zuerst stark machen.',[['Klimmzüge','3×10'],['Explosive Klimmzüge bis Brust','3×6'],['Negative Muscle-Ups','3×5'],['Muscle-Up (Straight Bar)','3×3']]],
 ['fl','Front Lever','🛩️','Schulterblätter nach unten ziehen, Körper steif wie ein Brett, Hüfte nicht einknicken.',[['Dead Hang + Scapula Pulls','3×30 s'],['Tuck Front Lever','3×10 s'],['Advanced Tuck','3×8 s'],['Straddle','3×6 s'],['Full Front Lever','3×5 s']]],
 ['pl','Planche','🦅','Hände weit nach vorn lehnen, Schultern über die Hände schieben, Gesäß fest anspannen.',[['Planche Lean','3×20 s'],['Tuck Planche','3×10 s'],['Advanced Tuck','3×8 s'],['Straddle','3×5 s'],['Full Planche','3×3 s']]],
 ['hf','Human Flag','🚩','Untere Hand drückt, obere Hand zieht. Zuerst Seitrumpf und Schultern stärken.',[['Seitstütz (Side Plank)','3×40 s'],['Klammer-Flag am Pfosten','3×10 s'],['Tuck Flag','3×8 s'],['Straddle Flag','3×6 s'],['Full Flag','3×5 s']]],
 ['ls','L-Sit zum V-Sit','🔻','Arme durchstrecken, Schultern runter drücken, Knie gestreckt, Zehenspitzen ziehen.',[['Tuck L-Sit','3×20 s'],['Ein Bein gestreckt','3×15 s'],['L-Sit','3×20 s'],['V-Sit','3×10 s']]],
 ['ps','Pistol Squat','🦵','Ferse bleibt am Boden, Brust aufrecht. Beweglichkeit der Knöchel regelmäßig dehnen.',[['Tiefe Kniebeuge halten','3×30 s'],['Pistol auf Box','3×8'],['Pistol mit Unterstützung','3×6'],['Freier Pistol Squat','3×5']]]
];
const $m = document.getElementById('m'), $n = document.getElementById('nav');
let DB = null, mref = null, OWNER = false;
let S = { log: [], skills: {}, goal: 4, prep: 5, plan: {}, bw: [], focus: null, profile: null, checks: [] }, ref = null, sess = null, view = 'train', end = 0, tick = null, selEx = null, sw = 0;
const dstr = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => dstr(new Date());
const mon = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return dstr(x); };

const topR = r => { const m = String(r).match(/\d+/g); return m ? +m[m.length - 1] : 0; };
const fmt = n => String(Math.round(n * 10) / 10).replace('.', ',');
const lastOf = ex => [...S.log].reverse().find(s => s.ex === ex);
const sk = id => S.skills[id] || (S.skills[id] = { lvl: 0, best: {} });

function prevSession(ex) {
  const a = S.log.filter(s => s.ex === ex && s.d !== today()); if (!a.length) return null;
  const d = a[a.length - 1].d; return a.filter(s => s.d === d);
}
function target(p, reps) {
  const t = topR(reps), lo = +(String(reps).match(/\d+/) || [0])[0];
  return (t && p.r >= t) ? { w: p.w + 2.5, r: lo || p.r } : { w: p.w, r: p.r + 1 };
}
function suggest(ex, sets, reps) {
  const all = S.log.filter(s => s.ex === ex); if (!all.length) return null;
  const ld = all[all.length - 1].d, ss = all.filter(s => s.d === ld), t = topR(reps);
  if (t && ss.length >= sets && ss.every(s => s.r >= t)) return ss[0].w + 2.5;

async function init() {
  try { const u = await claude.use("user"), db = await claude.use("db"); if (u && db) { DB = db; const id = await u.id(); ref = db.collection("data/users/" + id).doc("coach"); mref = db.collection("members").doc(id); OWNER = await u.isOwner(); } } catch (e) {}
  const loadLocal = () => { try { const l = localStorage.getItem('coach'); if (l) S = Object.assign(S, JSON.parse(l)); } catch (e) {} };
  try { if (ref) { const d = await ref.get(); if (d.exists) S = Object.assign(S, d.data()); else loadLocal(); } else loadLocal(); } catch (e) { loadLocal(); }
  if (S.profile && !S.checks.length) S.checks.push({ d: today(), t: { ...S.profile.t } });
  buildPlan(); if (!S.profile) view = 'setup'; render();
}
async function save() {
  try { localStorage.setItem('coach', JSON.stringify(S)); } catch (e) {}
  try { if (ref) await ref.set(S); } catch (e) {}
  sync();
}
async function sync() {
  if (!mref) return;
  try {
    if (S.share && S.profile) { const p = S.profile; await mref.set({ name: p.name, age: p.age, kg: S.bw.length ? S.bw[S.bw.length - 1].w : p.kg, goal: p.goal, lvl: p.lvl, t: p.t, updated: today() }); S.sent = true; }
    else if (S.sent) { await mref.delete(); S.sent = false; }
  } catch (e) {}
}
async function loadMembers(box) {
  try {
    const q = await DB.collection('members').get(); box.textContent = '';
    if (q.empty) { box.textContent = 'Noch niemand hat Daten geteilt.'; return; }
    q.docs.forEach(d => { const m = d.data(), t = m.t || {}, r = el('div', null, 'set'); r.style.flexDirection = 'column';
      r.appendChild(el('b', (m.name || '?') + ' · ' + (m.age || '–') + ' J. · ' + (m.kg ? fmt(m.kg) + ' kg' : '–')));
      r.appendChild(el('span', m.goal + ' · ' + m.lvl + ' | Klimmzüge ' + (t.pu || 0) + ', Liegestütze ' + (t.pp || 0) + ', Dips ' + (t.dp || 0) + ', Kniebeugen ' + (t.sq || 0) + ', Plank ' + (t.pl || 0) + ' s', 'mut')); box.appendChild(r); });
  } catch (e) { box.textContent = 'Konnte nicht geladen werden.'; }
}
function el(t, x, c) { const e = document.createElement(t); if (x != null) e.textContent = x; if (c) e.className = c; return e; }
function btn(x, f, c) { const b = el('button', x, 'btn' + (c ? ' ' + c : '')); b.onclick = f; return b; }
const ac = () => window._ac || (window._ac = new (window.AudioContext || window.webkitAudioContext)());
document.addEventListener('pointerdown', () => { try { const a = ac(); a.resume && a.resume(); } catch (e) {} });
function beep(f, d) {
  try { const a = ac(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; g.gain.value = .25; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d / 1000); } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(d); } catch (e) {}
}
function holdWidget(title, onSave) {
  const w = el('div', null, 'card ctr'); w.style.cssText = 'display:flex;flex-direction:column;gap:10px';
  w.appendChild(el('div', title, 'mut'));
  const t = el('div', '0.0', 'clock'), st = el('div', 'Vorbereitung: ' + S.prep + ' s', 'mut'); w.append(t, st);
  let mode = 0, t0 = 0, last = -1;
  const b = btn('▶ Start', () => {
    if (mode === 2) { const sec = Math.round((Date.now() - t0) / 100) / 10; mode = 0; clearInterval(tick); b.textContent = '▶ Start'; st.textContent = 'Gespeichert: ' + sec + ' s'; beep(500, 120); onSave(sec); return; }
    if (mode === 1) { mode = 0; clearInterval(tick); t.textContent = '0.0'; st.textContent = 'Vorbereitung: ' + S.prep + ' s'; b.textContent = '▶ Start'; return; }
    mode = 1; t0 = Date.now() + S.prep * 1000; last = -1; b.textContent = '✕ Abbrechen'; clearInterval(tick);
    tick = setInterval(() => {
      if (mode === 1) {
        const ms = t0 - Date.now();
        if (ms > 0) { const n = Math.ceil(ms / 1000); t.textContent = n; st.textContent = 'Geh jetzt in Position …'; if (n !== last) { last = n; beep(600, 80); } }
        else { mode = 2; t0 = Date.now(); b.textContent = '■ Stopp & speichern'; st.textContent = 'Halten!'; beep(1000, 350); }
      } else t.textContent = ((Date.now() - t0) / 1000).toFixed(1);
    }, 100);
  });
  const pb = btn('Vorbereitungszeit ändern (3 / 5 / 10 s)', () => { if (mode) return; S.prep = S.prep >= 10 ? 3 : S.prep === 3 ? 5 : 10; st.textContent = 'Vorbereitung: ' + S.prep + ' s'; save(); }, 'g');
  w.append(b, pb); return w;
}
function buildPlan() {
  const p = S.profile; if (!p) { PLAN = BASE; return; }
  const t = p.t || {}, T = { 'Klimmzüge': ['pu', 'Negative Klimmzüge (langsam ablassen)'], 'Liegestütze auf Parallettes': ['pp', 'Liegestütze auf Knien'], 'Dips': ['dp', 'Bankdips (Füße am Boden)'] }, o = {};
  Object.keys(BASE).forEach(k => {
    o[k] = BASE[k].map(([n, sets, reps, pause], i) => {
      let name = n, r = reps, ss = sets;
      if (T[n]) { const m = +(t[T[n][0]] || 0); if (m < 1) { name = T[n][1]; r = '5–8'; } else { const lo = Math.max(1, Math.round(m * .6)); r = lo + '–' + Math.max(lo + 2, m); } }
      if (p.lvl === 'Anfänger' && ss > 2) ss--;
      if (p.lvl === 'Profi' && i === 0) ss++;
      return [name, ss, r, pause + (p.age >= 50 ? 15 : 0)];
    });
  });
  PLAN = o;
}
function profileView() {
  const p = S.profile; if (!p) { go('setup'); return; }
  $m.appendChild(el('h1', '👤 Profil'));
  const c = el('div', null, 'card'); c.appendChild(el('div', p.name, 'big'));
  const bw = S.bw.length ? S.bw[S.bw.length - 1].w : p.kg;
  [['Alter', p.age ? p.age + ' Jahre' : '–'], ['Körpergewicht', bw ? fmt(bw) + ' kg' : '–'], ['Ziel', p.goal], ['Erfahrung', p.lvl], ['Wochenziel', S.goal + ' Trainings']].forEach(([k, v]) => { const r = el('div', null, 'set'); r.appendChild(el('span', k, 'mut')); r.appendChild(el('span', v)); c.appendChild(r); });
  $m.appendChild(c);
  const t = el('div', null, 'card'); t.appendChild(el('h2', '💪 Meine Basiswerte'));
  [['Klimmzüge', p.t.pu], ['Liegestütze', p.t.pp], ['Dips', p.t.dp], ['Kniebeugen', p.t.sq], ['Plank (Sek.)', p.t.pl]].forEach(([k, v]) => { const r = el('div', null, 'set'); r.appendChild(el('span', k, 'mut')); r.appendChild(el('span', String(v || 0))); t.appendChild(r); });
  $m.appendChild(t);
  const days = new Set(S.log.map(x => x.d + x.day)).size, lv = SK.reduce((a, x) => a + sk(x[0]).lvl, 0);
  const z = el('div', null, 'card'); z.appendChild(el('h2', '📈 Bisher'));
  [['Trainings', days], ['Sätze', S.log.length], ['Skill-Stufen geschafft', lv]].forEach(([k, v]) => { const r = el('div', null, 'set'); r.appendChild(el('span', k, 'mut')); r.appendChild(el('span', String(v))); z.appendChild(r); });
  $m.appendChild(z);
  if (OWNER) { const oc = el('div', null, 'card'); oc.appendChild(el('h2', '👥 Teilnehmer (nur für dich sichtbar)')); const box = el('div', 'Lade …', 'mut'); oc.appendChild(box); $m.appendChild(oc); loadMembers(box); }

  $m.appendChild(btn('Wochenziel ändern (aktuell ' + S.goal + ')', () => { S.goal = S.goal >= 6 ? 2 : S.goal + 1; save(); render(); }, 'g'));
  $m.appendChild(btn('📋 Daten sichern (in Zwischenablage kopieren)', () => { try { navigator.clipboard.writeText(JSON.stringify(S)); alert('Kopiert! Füge es in eine Notiz ein.'); } catch (e) { alert('Kopieren nicht möglich.'); } }, 'g'));
}
const firstMon = (y, m) => { const d = new Date(y, m, 1); d.setDate(1 + (8 - d.getDay()) % 7); return d; };
const TN = { pu: 'Klimmzüge', pp: 'Liegestütze', dp: 'Dips', sq: 'Kniebeugen', pl: 'Plank (Sek.)' };
function checkDone() { return S.checks.some(c => c.d.slice(0, 7) === today().slice(0, 7)); }
function dueNow() { if (!S.profile) return false; const t = new Date(); return today() >= dstr(firstMon(t.getFullYear(), t.getMonth())) && !checkDone(); }
function nextCheck() { const t = new Date(); let f = firstMon(t.getFullYear(), t.getMonth()); if (checkDone() || dstr(f) < today()) f = firstMon(t.getFullYear(), t.getMonth() + 1); return f; }
function checkView() {

    const i = el('input'); i.type = 'number'; i.inputMode = 'numeric'; i.placeholder = String(last[k] || 0); i.style.marginTop = '6px'; c.appendChild(i); F[k] = i; $m.appendChild(c);
  });
  const wc = el('div', null, 'card'); wc.appendChild(el('label', 'Körpergewicht (kg, optional)', 'mut')); const wi = el('input'); wi.type = 'number'; wi.inputMode = 'decimal'; wi.style.marginTop = '6px'; wc.appendChild(wi); $m.appendChild(wc);
  $m.appendChild(btn('✓ Check speichern', () => {
    const t = {}; Object.keys(TN).forEach(k => { const v = F[k].value === '' ? (last[k] || 0) : (+F[k].value || 0); t[k] = v; });

function previewView(k) {

function setupView() {

  const bc = el('div', null, 'card'); bc.appendChild(el('h2', '🏆 Bestwerte'));
  exs.forEach(x => { const b = S.log.filter(s => s.ex === x).sort((a, c) => e1(c) - e1(a))[0]; bc.appendChild(el('div', x + ': +' + fmt(b.w) + ' kg × ' + b.r, 'set')); }); $m.appendChild(bc);
}
init();
</script>
