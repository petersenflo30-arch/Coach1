*{box-sizing:border-box}

.btn:active{transform:scale(.98)}
.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--line);box-shadow:none;font-size:15px;font-weight:600;padding:13px}

svg{width:100%;height:auto}
</style>
</head>

    const pb = Math.max(0, ...S.log.filter(s => s.ex === c.ex).map(e1)), ent = { d: today(), day: sess.k, ex: c.ex, w: wv, r: rv };
    if (pb > 0 && e1(ent) > pb && !sess.pr.includes(c.ex)) { sess.pr.push(c.ex); popup('🏆 Neuer Rekord!', c.ex + ': ' + (wv > 0 ? '+' + fmt(wv) + ' kg × ' : '') + rv); }
    S.log.push(ent); save(); sess.done++; sess.i++;
    if (sess.i >= sess.q.length) go('done'); else { end = Date.now() + c.pause * 1000; go('rest'); }
  }));
  $m.appendChild(btn('+ Zusatzsatz', () => {
    const ix = sess.q.map((x, i) => x.ex === c.ex ? i : -1).filter(i => i >= 0), li = ix[ix.length - 1], nn = sess.q[li].n + 1;
    ix.forEach(i => sess.q[i].total = nn); sess.q.splice(li + 1, 0, { ...c, n: nn, total: nn }); render();
  }, 'g'));
  $m.appendChild(btn('Übung überspringen', () => { const x = c.ex; while (sess.i < sess.q.length && sess.q[sess.i].ex === x) sess.i++; go(sess.i >= sess.q.length ? 'done' : 'set'); }, 'g'));
  $m.appendChild(btn('Training beenden', () => go(sess.done ? 'done' : 'train'), 'g'));
}

function restView() {
  const nx = sess.q[sess.i], t = el('div', null, 'ctr'), clk = el('div', '', 'clock');
  say('Pause. Als Nächstes: ' + nx.ex + ', Satz ' + nx.n + sayTarget(tgFor(nx), nx.ex));
  t.appendChild(el('div', 'Pause', 'mut')); t.appendChild(clk); $m.appendChild(t);
  if (sess.pr.length) $m.appendChild(el('div', '🏆 Neuer Rekord: ' + sess.pr[sess.pr.length - 1] + '!', 'hint ctr'));
  const card = el('div', null, 'card ctr'); card.appendChild(el('div', 'Als Nächstes', 'mut')); card.appendChild(el('h2', nx.ex)); card.appendChild(el('div', 'Satz ' + nx.n + ' von ' + nx.total, 'mut')); $m.appendChild(card);
  let lb = -1; const show = () => { const l = Math.max(0, Math.ceil((end - Date.now()) / 1000)); if (l <= 3 && l > 0 && l !== lb) { lb = l; if (S.voice === false) beep(600, 80); else say(String(l)); } clk.textContent = Math.floor(l / 60) + ':' + String(l % 60).padStart(2, '0'); if (l <= 0) { clearInterval(tick); beep(1000, 350); go('set'); } };
  show(); tick = setInterval(show, 250);
  $m.appendChild(btn('+30 s', () => { end += 30000; show(); }, 'g'));
  $m.appendChild(btn('Weiter → nächster Satz', () => go('set')));
}

function doneView() {
  const sw = streakWeeks(); [2, 4, 8, 12].forEach(n => { if (sw >= n) award('streak' + n, '🔥 ' + n + ' Wochen in Folge!', 'Dein Wochenziel ' + n + ' Wochen hintereinander geschafft.'); });
  say('Training geschafft. Stark!');
  $m.appendChild(el('h1', '🎉 Geschafft!'));
  const ss = S.log.filter(s => s.d === today() && s.day === sess.k).slice(-sess.done), vol = ss.reduce((a, s) => a + s.w * s.r, 0);
  const c = el('div', null, 'card'); c.appendChild(el('h2', sess.k + ' · ' + sess.done + ' Sätze'));
  c.appendChild(el('div', 'Zusatzgewicht-Volumen: ' + Math.round(vol) + ' kg', 'mut'));
  sess.pr.forEach(p => c.appendChild(el('div', '🏆 Rekord: ' + p, 'set')));
  ss.forEach(s => c.appendChild(el('div', s.ex + ': +' + fmt(s.w) + ' kg × ' + s.r, 'set')));
  c.appendChild(el('div', '+' + (sess.done * 10 + 50 + sess.pr.length * 25) + ' XP verdient', 'mut')); $m.appendChild(c);
  const xi = xpInfo(); if (xi.lvl > (S.lvl || 1)) { S.lvl = xi.lvl; save(); popup('⭐ Level ' + xi.lvl + '!', 'Du hast ' + xi.xp + ' XP gesammelt. Weiter so!'); }
  $m.appendChild(el('div', '💬 ' + QUOTES[Math.floor(Math.random() * QUOTES.length)], 'hint'));
  $m.appendChild(btn('Fertig', () => go('train')));
}

let cm = new Date(new Date().getFullYear(), new Date().getMonth(), 1), csel = today();
function calView() {
  $m.appendChild(el('h1', '📅 Kalender'));
  $m.appendChild(el('div', '🔥 Streak: ' + streakWeeks() + (streakWeeks() === 1 ? ' Woche' : ' Wochen') + ' Ziel erreicht · ' + new Set(S.log.map(x => x.d)).size + ' Trainingstage insgesamt', 'hint'));
  const c = el('div', null, 'card'), hd = el('div', null, 'row'); hd.style.alignItems = 'center';
  const pv = btn('‹', () => { cm = new Date(cm.getFullYear(), cm.getMonth() - 1, 1); render(); }, 'g'), nx = btn('›', () => { cm = new Date(cm.getFullYear(), cm.getMonth() + 1, 1); render(); }, 'g');
  const ti = el('h2', cm.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' })); ti.style.cssText = 'flex:3;text-align:center';
  pv.style.cssText = nx.style.cssText = 'flex:1;width:auto;padding:10px;font-size:20px'; hd.append(pv, ti, nx); c.appendChild(hd);
  const g = el('div'); g.style.cssText = 'display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px';
  ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].forEach(d => { const e = el('div', d, 'mut ctr'); g.appendChild(e); });
  const y = cm.getFullYear(), mo = cm.getMonth(), off = (new Date(y, mo, 1).getDay() + 6) % 7, dim = new Date(y, mo + 1, 0).getDate(), done = {};
  S.log.forEach(x => { (done[x.d] = done[x.d] || new Set()).add(x.day); });
  for (let i = 0; i < off; i++) g.appendChild(el('div'));
  for (let d = 1; d <= dim; d++) {
    const ds = dstr(new Date(y, mo, d)), dn = done[ds], pl = S.plan[ds];
    const b = el('button', null); b.style.cssText = 'border:0;border-radius:10px;padding:6px 0;color:' + (dn ? '#fff' : 'var(--fg)') + ';background:' + (dn ? '#16a34a' : pl ? '#16a34a33' : 'var(--bg)') + ';' + (ds === csel ? 'outline:2px solid var(--ac);' : '') + (ds === today() ? 'font-weight:700;' : '');
    b.appendChild(el('div', d)); const sm = el('div', dn ? [...dn].map(x => x.slice(0, 2)).join(' ') : pl ? '○ ' + pl.slice(0, 2) : '·'); sm.style.fontSize = '10px'; b.appendChild(sm);
    b.onclick = () => { csel = ds; render(); }; g.appendChild(b);
  }
  c.appendChild(g); $m.appendChild(c);
  const sel = el('div', null, 'card'); sel.appendChild(el('h2', new Date(csel + 'T12:00').toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' })));
  const day = S.log.filter(x => x.d === csel);
  if (day.length) [...new Set(day.map(x => x.day))].forEach(k => { const ss = day.filter(x => x.day === k); sel.appendChild(el('div', '✅ ' + k + ' · ' + ss.length + ' Sätze', 'set')); ss.forEach(x => { const r = el('div', null, 'set'); r.appendChild(el('span', x.ex + ': +' + fmt(x.w) + ' kg × ' + x.r, 'mut')); const d = el('button', '✕'); d.style.cssText = 'border:0;background:none;color:#e5384f;font-size:16px'; d.onclick = () => { S.log.splice(S.log.indexOf(x), 1); save(); render(); }; r.appendChild(d); sel.appendChild(r); }); });
  else sel.appendChild(el('div', S.plan[csel] ? '📌 Geplant: ' + S.plan[csel] : 'Kein Training eingetragen.', 'mut'));
  $m.appendChild(sel);
  const pc = el('div', null, 'card'); pc.appendChild(el('h2', 'Training planen')); pc.appendChild(el('div', 'Tippe ein Training für diesen Tag:', 'mut'));
  const row = el('div'); row.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-top:8px';
  Object.keys(PLAN).forEach(k => { const b = btn(k, () => { S.plan[csel] = k; save(); render(); }, S.plan[csel] === k ? '' : 'g'); b.style.cssText = 'width:auto;flex:1 0 30%'; row.appendChild(b); });
  pc.appendChild(row);
  if (S.plan[csel]) { pc.appendChild(btn('▶ ' + S.plan[csel] + ' jetzt starten', () => start(S.plan[csel]))); pc.appendChild(btn('Plan entfernen', () => { delete S.plan[csel]; save(); render(); }, 'g')); }
  $m.appendChild(pc);
}

function skillList() {
  $m.appendChild(el('h1', '🎯 Skills lernen')); $m.appendChild(el('div', 'Stufe für Stufe zum Ziel. Tippe auf einen Skill.', 'mut'));
  SK.forEach(([id, name, em, , st]) => {
    const l = sk(id).lvl, b = el('button', null, 'start'), d = el('div');
    d.appendChild(el('b', em + ' ' + name)); d.appendChild(el('br'));
    d.appendChild(el('span', l >= st.length ? '✅ Geschafft!' : 'Aktuell: ' + st[l][0]));
    b.appendChild(d); b.appendChild(el('span', l + '/' + st.length)); b.onclick = () => go('skill:' + id); $m.appendChild(b);
  });
}

function skillView(id) {
  const [, name, em, tip, st] = SK.find(s => s[0] === id), p = sk(id);
  $m.appendChild(btn('← Alle Skills', () => go('skills'), 'g'));
  $m.appendChild(el('h1', em + ' ' + name)); $m.appendChild(el('div', '💡 ' + tip, 'hint'));
  $m.appendChild(el('div', '📆 Skill 2–3× pro Woche am Trainingsanfang üben: 3–5 Versuche, nie bis zur Erschöpfung. Erst die Stufe wechseln, wenn das Ziel sauber klappt.', 'hint'));
  $m.appendChild(btn(S.focus === id ? '⭐ Fokus-Skill (tippen zum Entfernen)' : '☆ Als Fokus-Skill setzen', () => { S.focus = S.focus === id ? null : id; save(); render(); }, 'g'));
  const c = el('div', null, 'card');
  st.forEach(([n, g], i) => {
    const d = el('div', null, 'set' + (i === p.lvl ? ' cur' : '')); d.appendChild(el('span', (i < p.lvl ? '✓ ' : i + 1 + '. ') + n));
    d.appendChild(el('span', g + (p.best[i] ? ' · Best ' + p.best[i] + ' s' : ''), 'mut')); c.appendChild(d);
  });
  $m.appendChild(c);
  if (p.lvl < st.length) {
    $m.appendChild(holdWidget('Halte-Timer für: ' + st[p.lvl][0], sec => { if (sec > (p.best[p.lvl] || 0)) { p.best[p.lvl] = sec; save(); } }));
    $m.appendChild(btn('✓ Stufe geschafft → nächste', () => { const nm = st[p.lvl][0]; p.lvl++; award('skill:' + id + ':' + p.lvl, '🎯 Stufe geschafft!', name + ': ' + nm); save(); render(); }, 'g'));
  } else $m.appendChild(el('div', '🏆 Alle Stufen geschafft. Stark!', 'card ctr'));
  if (p.lvl > 0) $m.appendChild(btn('← eine Stufe zurück', () => { p.lvl--; save(); render(); }, 'g'));
}

function line(pts, labels) {
  if (pts.length < 2) return el('div', 'Noch zu wenig Daten (mindestens 2 Trainingstage).', 'mut');
  const mx = Math.max(...pts), mn = Math.min(...pts), rg = mx - mn || 1, W = 300, H = 110;
  const xy = pts.map((v, i) => [10 + i * (W - 20) / (pts.length - 1), H - 15 - (v - mn) / rg * (H - 35)]);
  const ns = 'http://www.w3.org/2000/svg', s = document.createElementNS(ns, 'svg'); s.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  const pl = document.createElementNS(ns, 'polyline'); pl.setAttribute('points', xy.map(p => p.join(',')).join(' ')); pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', '#16a34a'); pl.setAttribute('stroke-width', '3'); s.appendChild(pl);
  [0, xy.length - 1].forEach(i => { const t = document.createElementNS(ns, 'text'); t.setAttribute('x', xy[i][0]); t.setAttribute('y', xy[i][1] - 8); t.setAttribute('font-size', '12'); t.setAttribute('fill', 'currentColor'); t.setAttribute('text-anchor', i ? 'end' : 'start'); t.textContent = fmt(pts[i]); s.appendChild(t); });
  return s;
}

function stats() {
  $m.appendChild(el('h1', '📊 Statistik'));
  const cs = S.checks || [], cc = el('div', null, 'card'); cc.appendChild(el('h2', '🗓️ Monatscheck: wie stark bist du?'));
  cc.appendChild(el('div', dueNow() ? '⚠️ Fällig! Mach den Check, um weiter zu trainieren.' : 'Nächster Check: ' + nextCheck().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }), 'mut'));
  if (dueNow()) cc.appendChild(btn('Check jetzt machen', () => go('check')));
  if (cs.length >= 2) {
    const f = cs[0].t, ks = Object.keys(f).filter(k => f[k] > 0), idx = cs.map(x => ks.length ? ks.reduce((a, k) => a + (x.t[k] || 0) / f[k] * 100, 0) / ks.length : 100);
    const h = el('div', 'Stärke-Index (erster Check = 100 %)', 'mut'); h.style.marginTop = '10px'; cc.appendChild(h); cc.appendChild(line(idx));
    cc.appendChild(el('div', new Date(cs[0].d + 'T12:00').toLocaleDateString('de-DE') + '  →  ' + new Date(cs[cs.length - 1].d + 'T12:00').toLocaleDateString('de-DE'), 'mut'));
    const l = cs[cs.length - 1].t; Object.keys(TN).forEach(k => { const d = (l[k] || 0) - (f[k] || 0), r = el('div', null, 'set'); r.appendChild(el('span', TN[k])); r.appendChild(el('span', (f[k] || 0) + ' → ' + (l[k] || 0) + ' (' + (d > 0 ? '+' : '') + d + ')', 'mut')); cc.appendChild(r); });
  } else cc.appendChild(el('div', 'Das Diagramm erscheint nach deinem 2. Monatscheck.', 'mut'));
  $m.appendChild(cc);
  const b0 = el('div', null, 'card'); b0.appendChild(el('h2', '⚖️ Körpergewicht'));
  const r0 = el('div', null, 'row'), bi = el('input'), bs = btn('Speichern', () => { const v = parseFloat(bi.value.replace(',', '.')); if (isNaN(v)) return; S.bw = S.bw.filter(x => x.d !== today()); S.bw.push({ d: today(), w: v }); save(); render(); });
  r0.style.marginTop = '8px'; bi.type = 'number'; bi.inputMode = 'decimal'; bi.placeholder = S.bw.length ? String(S.bw[S.bw.length - 1].w) : 'kg'; bs.style.cssText = 'width:auto;flex:0 0 auto;font-size:16px'; r0.append(bi, bs); b0.appendChild(r0);
  if (S.bw.length > 1) b0.appendChild(line(S.bw.map(x => x.w))); else if (S.bw.length) b0.appendChild(el('div', 'Aktuell: ' + fmt(S.bw[0].w) + ' kg', 'mut'));
  $m.appendChild(b0);
  if (!S.log.length) { $m.appendChild(el('div', 'Starte dein erstes Training, dann erscheinen hier Diagramme.', 'mut')); return; }
  const exs = [...new Set(S.log.map(s => s.ex))]; if (!selEx || !exs.includes(selEx)) selEx = exs[0];
  const pc = el('div', null, 'card'); pc.appendChild(el('h2', 'Fortschritt pro Übung'));
  const sel = el('select'); exs.forEach(e => { const o = el('option', e); sel.appendChild(o); }); sel.value = selEx; sel.onchange = () => { selEx = sel.value; render(); };
  sel.style.margin = '8px 0'; pc.appendChild(sel);
  const byD = {}; S.log.filter(s => s.ex === selEx).forEach(s => { byD[s.d] = Math.max(byD[s.d] || 0, e1(s)); });
  pc.appendChild(line(Object.keys(byD).sort().map(k => byD[k]))); pc.appendChild(el('div', 'Geschätztes Maximum (1RM) bzw. beste Wiederholungen je Tag', 'mut')); $m.appendChild(pc);
  const bc = el('div', null, 'card'); bc.appendChild(el('h2', '🏆 Bestwerte'));
  exs.forEach(x => { const b = S.log.filter(s => s.ex === x).sort((a, c) => e1(c) - e1(a))[0]; bc.appendChild(el('div', x + ': +' + fmt(b.w) + ' kg × ' + b.r, 'set')); }); $m.appendChild(bc);
  const hc = el('div', null, 'card'); hc.appendChild(el('h2', '🗂️ Trainingshistorie'));
  [...new Set(S.log.map(x => x.d + '|' + x.day))].sort().reverse().slice(0, 12).forEach(key => { const [d, dy] = key.split('|'), ss = S.log.filter(x => x.d === d && x.day === dy), vol = ss.reduce((a, x) => a + x.w * x.r, 0), r = el('div', null, 'set'); r.appendChild(el('span', new Date(d + 'T12:00').toLocaleDateString('de-DE', { day: 'numeric', month: 'short' }) + ' · ' + dy)); r.appendChild(el('span', ss.length + ' Sätze' + (vol ? ' · ' + Math.round(vol) + ' kg' : ''), 'mut')); hc.appendChild(r); });
  $m.appendChild(hc);
}
init();
</script>
